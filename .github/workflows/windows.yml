name: Windows CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install MinGW and native dependencies
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p ninja:p openssl:p curl-winssl:p
            spdlog:p nlohmann-json:p gtest:p

      - name: Select the UCRT64 toolchain
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $prefix = Join-Path $env:MSYS2_ROOT 'ucrt64'
          "$prefix/bin" >> $env:GITHUB_PATH
          "MINGW_PREFIX=$prefix" >> $env:GITHUB_ENV

      - name: Configure Release with desktop and tests
        run: |
          $licenses = Get-ChildItem "$env:MINGW_PREFIX/share/licenses" -Recurse -File
          $notices = ($licenses.FullName -replace '\\', '/') -join ';'
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CXX_COMPILER=g++.exe" "-DCMAKE_RC_COMPILER=windres.exe" `
            "-DCMAKE_PREFIX_PATH=$env:MINGW_PREFIX" "-DPORTABLE_LICENSE_FILES=$notices" `
            "-DNODE_EXECUTABLE=$((Get-Command node.exe).Source)" `
            "-DOPENSSL_PROGRAM=$((Get-Command openssl.exe).Source)" `
            -DBUILD_DESKTOP=ON -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci --parallel 4

      - name: Run unit and integration tests
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error --parallel 2

      - name: Package the tested build
        run: cpack --config build/ci/CPackConfig.cmake -C Release

      - name: Build the installer from the portable ZIP
        run: |
          $zip = Get-Item build/ci/dist/TorrentClient-*-windows-x64.zip
          ./packaging/build-installer.ps1 -Archive $zip.FullName

      - name: Save Windows packages and checksums
        uses: actions/upload-artifact@v7
        with:
          name: TorrentClient-windows-x64
          path: |
            build/ci/dist/*.zip
            build/ci/dist/*.zip.sha256
            build/ci/dist/*-setup.exe
            build/ci/dist/*-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0

  verify:
    needs: portable
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: TorrentClient-windows-x64
          path: build/dist
      - name: Verify the portable application on a fresh runner
        run: |
          $zip = Get-Item build/dist/TorrentClient-*-windows-x64.zip
          node tests/integration/test_portable.cjs $zip.FullName
      - name: Install, interrupt a download, restart and uninstall
        run: |
          $zip = Get-Item build/dist/TorrentClient-*-windows-x64.zip
          ./tests/integration/test_installer.ps1 -Archive $zip.FullName

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TorrentClient-windows-x64
          path: dist
      - name: Publish the tested packages for the version tag
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          base="TorrentClient-${GITHUB_REF_NAME#v}-windows-x64"
          cat "$base.zip.sha256" "$base-setup.exe.sha256" | tr -d '\r' | sha256sum --check --strict
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            "$base.zip" "$base.zip.sha256" "$base-setup.exe" "$base-setup.exe.sha256"
